# Weekly update PRs for pinned dependencies. Server lock files must be recompiled with hashes after a bump
# (see the header of server/requirements*.in); the GPU path then needs `make smoke` on real hardware before merging.
# PRs target develop (the test environment); main only receives releases from develop.
# The server's runtime packages (fastapi, ...) are pinned twice, in pyproject.toml (uv) and server/requirements.in (pip):
# the two ecosystems open separate PRs for the same bump, which must be merged together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /server
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      # react-dom pins a peer dependency on the same react version: bumped alone, `npm ci` fails with ERESOLVE.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
