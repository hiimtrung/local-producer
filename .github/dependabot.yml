# Weekly update PRs for pinned dependencies. Server lock files must be recompiled with hashes after a bump
# (run scripts/lock-requirements.sh); the GPU path then needs `make smoke` on real hardware before merging.
# Every update PR targets main, the only long-lived branch (trunk-based).
# The server's runtime packages (fastapi, ...) are pinned twice, in pyproject.toml (uv) and server/requirements.in (pip):
# the two ecosystems open separate PRs for the same bump, which must be merged together.
# The pip ecosystem targets /server, which maintains two platform lock files: requirements.linux.txt and
# requirements.macos.txt. `make lock-check` (scripts/lock-requirements.sh --check) is the authoritative synchronization
# gate ensuring both lock files match requirements.in and carry identical package versions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      # react-dom pins a peer dependency on the same react version: bumped alone, `npm ci` fails with ERESOLVE.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # `three` is only @google/model-viewer's peer dependency; it is not imported in web/src.
      # model-viewer 4.4.0 (latest) declares peer three ^0.183.0, so any newer three fails `npm ci` with ERESOLVE.
      # Remove this rule once model-viewer accepts a newer three, or let it bump both together.
      - dependency-name: three
        versions:
          - ">=0.184.0"
