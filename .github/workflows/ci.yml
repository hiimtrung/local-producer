name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read  # least privilege; no job needs to write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, secret scan, file hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the history of the pushed commits
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run python scripts/check_docs.py
      - run: make check-removal

  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run python scripts/check_docs.py

  typecheck:
    name: Type checks (mypy --strict, generated API types)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - run: uv run mypy
      - run: uv run python scripts/gen_api_types.py --check

  web:
    name: Web UI (tsc --strict, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p .
      - run: node build.mjs

  addon:
    name: Blender add-on package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: blender/build_addon.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: local_producer
          path: dist/local_producer.zip

  runtime:
    name: Runtime smoke test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24.21.0
      - name: Install web dependencies
        run: cd web && npm ci --ignore-scripts
      - name: Set LP_HOME
        run: echo "LP_HOME=$RUNNER_TEMP/lp" >> "$GITHUB_ENV"
      - name: Verify data root matches LP_HOME
        run: |
          root="$(scripts/lp root)"
          test "$root" = "$LP_HOME"
      - name: Setup runtime environment
        run: scripts/lp setup
      - name: Start supervisor
        run: scripts/lp up --no-matte
      - name: Probe health
        run: curl -fsS http://127.0.0.1:13305/health
      - name: Check status
        run: scripts/lp status
      - name: Print logs
        run: scripts/lp logs --lines 20
      - name: Stop supervisor
        run: scripts/lp down
      - name: Assert clean process shutdown
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            ! ps -A -o command= | grep -E 'python.*app\.(main|supervisor)' | grep -v grep
          else
            ! pgrep -f 'app\.(main|supervisor)'
          fi
